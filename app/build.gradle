plugins {
    // AGP 9.x 内置 Kotlin 支持；仅 Compose 编译器插件仍需显式声明
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21'
}

android {
    namespace 'com.chengzi.stayhifi'
    compileSdk 37

    defaultConfig {
        applicationId 'com.chengzi.stayhifi'
        minSdk 29
        targetSdk 37
        versionCode 2
        versionName '0.9.0'
    }

    buildFeatures {
        aidl true
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    // Task 22：只保留 icons-core（Home/Settings 在内）；Headphones 已内联为 StayHiFiIcons.Headphones，
    // 移除 icons-extended（~2000 枚图标类全量进 dex，曾致 debug 包 77.8M）。
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
