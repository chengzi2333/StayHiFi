plugins {
    // AGP 9.x 内置 Kotlin 支持；仅 Compose 编译器插件仍需显式声明
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.21'
}

android {
    namespace 'com.chengzi.stayhifi'
    compileSdk 37

    defaultConfig {
        applicationId 'com.chengzi.stayhifi'
        minSdk 29
        targetSdk 37
        versionCode 6
        versionName '1.2.1'
        // Task C4：机型目录宿主测试（仅测试依赖，不进发布包）。
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Task 29：release 签名全走环境变量（CI/本地发布机注入），不写死任何路径/密码。
        // 环境变量缺失时占位（配置期不炸），等任务图确定要构建 release 时再报清晰错误；
        // debug 走 AGP 默认签名，完全不受影响。
        release {
            storeFile file(System.getenv('STAYHIFI_KEYSTORE') ?: 'release-signing-not-configured')
            storePassword System.getenv('STAYHIFI_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('STAYHIFI_KEY_ALIAS') ?: ''
            keyPassword System.getenv('STAYHIFI_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Task 29：任务图确定要构建 release 但签名环境变量缺失 → 报清晰错误（debug 任务图不触发）。
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        def missing = [
            'STAYHIFI_KEYSTORE', 'STAYHIFI_STORE_PASSWORD',
            'STAYHIFI_KEY_ALIAS', 'STAYHIFI_KEY_PASSWORD',
        ].findAll { System.getenv(it) == null }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "release 签名环境变量缺失: ${missing.join(', ')}（debug 构建无需设置）")
        }
    }
}

// Task 29：AGP 9.4.1 的 compose group mapping 工具默认索要 compose-group-mapping:2.2.10
//（AGP 出厂默认 Kotlin 版本），该版本从未发布到 Maven Central（现有 2.3.0+）；
// 对齐本项目 Kotlin 2.4.x 线强升到 2.4.20。仅影响 release 的 compose 组映射工具，不进 APK。
configurations.named('composeMappingProducerClasspath') {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            details.requested.name == 'compose-group-mapping') {
            details.useVersion '2.4.20'
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    // Task 22：只保留 icons-core（Home/Settings 在内）；Headphones 已内联为 StayHiFiIcons.Headphones，
    // 移除 icons-extended（~2000 枚图标类全量进 dex，曾致 debug 包 77.8M）。
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
